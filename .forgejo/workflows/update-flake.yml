name: Update flake.lock

on:
  schedule:
    - cron: "0 1 */3 * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FORGE_TOKEN }}

      - name: Setup Nix
        uses: ./.forgejo/actions/setup-nix
        with:
          github-access-token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key

          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key
          git config --global commit.gpgsign true

      - name: Update flake.lock
        run: nix flake update

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        with:
          commit_message: "📦 update flake.lock"
          commit_user_name: "Álvaro Salcedo García"
          commit_user_email: "alvaro@alvr.dev"
          commit_author: "Álvaro Salcedo García <alvaro@alvr.dev>"
          branch: ${{ github.ref_name }}
          file_pattern: flake.lock
          skip_fetch: true
          before_push_hook: |
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0=credential.helper
            export GIT_CONFIG_VALUE_0='!f() { printf "username=alvr\npassword=%s\n" "$FORGE_TOKEN"; }; f'
