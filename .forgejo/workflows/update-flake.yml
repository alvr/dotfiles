name: Update flake.lock

on:
  schedule:
    - cron: "0 1 */3 * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nix
        uses: ./.forgejo/actions/setup-nix
        with:
          github-access-token: ${{ secrets.GH_TOKEN }}          

      - name: Configure Git
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/signing_key <<'EOF'
          ${{ secrets.SSH_SIGNING_KEY }}
          EOF

          chmod 600 ~/.ssh/signing_key
            
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key
          git config --global commit.gpgsign true

          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub

          printf "* %s\n" "$(cat ~/.ssh/signing_key.pub)" > ~/.ssh/allowed_signers

          git config --global gpg.ssh.allowedSignersFile ~/.ssh/allowed_signers

      - name: Update flake.lock
        run: nix flake update

      - name: Commit and push changes
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          set -euo pipefail

          git config --local user.name "Álvaro Salcedo García"
          git config --local user.email "alvaro@alvr.dev"

          git add flake.lock

          if git diff --cached --quiet; then
            echo "flake.lock unchanged, nothing to push"
            exit 0
          fi

          git commit -S -m "📦 update flake.lock"

          git -c credential.helper= \
            -c credential.helper='!f() { printf "username=alvr\npassword=%s\n" "$FORGEJO_TOKEN"; }; f' \
            push origin "HEAD:${{ github.ref }}"
