name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: ./.forgejo/actions/setup-nix
        with:
          github-access-token: ${{ secrets.GH_TOKEN }}

      - name: Resolve evaluation-time dependencies
        run: |
          for host in $(nix eval --raw .#nixosConfigurations --apply 'cs: builtins.concatStringsSep " " (builtins.attrNames cs)'); do
            nix eval --option allow-import-from-derivation true --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" > /dev/null
          done

      - name: Run flake check
        run: nix develop .#dev-nix -c nix flake check --no-build
