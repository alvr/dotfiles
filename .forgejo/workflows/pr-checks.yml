name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install prerequisites
        run: |
          apt-get update -y
          apt-get install -y sudo xz-utils curl
      
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GH_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://catppuccin.cachix.org
            extra-trusted-public-keys = catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      - name: Prefetch catppuccin palette
        run: |
          nix build --no-link --impure --expr '
            let flake = builtins.getFlake (toString ./.);
            in flake.inputs.catppuccin.packages.${builtins.currentSystem}.palette
          '

      - name: Run flake check
        run: nix develop .#dev-nix -c nix flake check --no-build
