name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GH_TOKEN }}

      - name: Check formatting
        run: |
          nix develop .#dev-nix -c nix fmt
          if [ -n "$(git diff --name-only)" ]; then
            echo "Code is not properly formatted. Please run 'nix fmt' locally."
            git diff
            exit 1
          fi

      - name: Run statix
        run: nix develop .#dev-nix -c statix check

      - name: Run flake check
        run: nix develop .#dev-nix -c nix flake check --no-build
