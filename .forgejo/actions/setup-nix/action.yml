name: 'Setup Nix'
description: Install Nix and configure the project's binary caches.

inputs:
  github-access-token:
    description: 'Token Nix uses to fetch from GitHub'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install sudo
      run: |
        apt-get update -y
        apt-get install -y --no-install-recommends sudo

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        github_access_token: ${{ inputs.github-access-token }}
        enable_kvm: false
        extra_nix_config: |
          extra-substituters = https://nyx-cache.chaotic.cx https://nix-community.cachix.org https://catppuccin.cachix.org https://noctalia.cachix.org https://umbriel.cachix.org
          extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= umbriel.cachix.org-1:JfNq/2yg2S6D6z4Z2dVSZrZlDPQTKtexB6GAVLD98nw=
