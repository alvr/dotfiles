name: 'Setup Nix'
description: Install Nix and configure the project's binary caches.

inputs:
  github-access-token:
    description: 'Token Nix uses to fetch from GitHub'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install sudo
      run: |
        apt-get update -y
        apt-get install -y --no-install-recommends sudo

    - name: Install Determinate Nix
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-access-token }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSfL https://install.determinate.systems/nix -o /tmp/nix-install
        sh /tmp/nix-install install linux --determinate --init none --no-confirm \
          --extra-conf "trusted-users = root ${USER:-runner}" \
          --extra-conf "access-tokens = github.com=${GH_TOKEN}" \
          --extra-conf "extra-substituters = https://nyx-cache.chaotic.cx https://nix-community.cachix.org https://catppuccin.cachix.org https://noctalia.cachix.org https://umbriel.cachix.org https://wvhulle.cachix.org" \
          --extra-conf "extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= umbriel.cachix.org-1:JfNq/2yg2S6D6z4Z2dVSZrZlDPQTKtexB6GAVLD98nw= wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0="

    - name: Expose Nix on PATH for later steps
      shell: bash
      run: echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

    - name: Resolve evaluation-time dependencies
      run: |
        for host in $(nix eval --raw .#nixosConfigurations --apply 'cs: builtins.concatStringsSep " " (builtins.attrNames cs)'); do
          nix eval --option allow-import-from-derivation true --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" > /dev/null
        done
