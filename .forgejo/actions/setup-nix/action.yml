name: 'Setup Nix'
description: Install system prerequisites and Nix, then wire the project's binary caches.

inputs:
  github-access-token:
    description: 'Token Nix uses to fetch from GitHub'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install prerequisites
      run: |
        apt-get update -y
        apt-get install -y sudo xz-utils curl git openssh-client

        # Container runners do not export USER, which makes `cachix use` fail.
        if [ -z "${USER:-}" ]; then
          echo "USER=$(id -un)" >> "$GITHUB_ENV"
        fi

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        github_access_token: ${{ inputs.github-access-token }}
        extra_nix_config: |
          extra-substituters = https://nyx-cache.chaotic.cx
          extra-trusted-public-keys = nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

    - name: Use cachix caches
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: nix-community
        extraPullNames: devenv,catppuccin,noctalia,umbriel
